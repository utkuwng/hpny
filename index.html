<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lộc Thần Tài Gõ Cửa 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@700;900&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* --- 1. SETUP & THEME --- */
        :root {
            --red-deep: #680000;
            --red-bright: #d90000;
            --gold: #ffd700;
            --gold-light: #fffacd;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--red-deep);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,215,0,0.1) 0%, rgba(0,0,0,0.6) 80%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 10px);
            overflow: hidden;
            height: 100vh;
            font-family: 'Playfair Display', serif;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- STAGE CHUNG --- */
        .stage {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.8s ease-in-out;
            opacity: 0; pointer-events: none; z-index: 10;
        }
        .stage.active { opacity: 1; pointer-events: auto; }
        .stage.exit { opacity: 0; transform: scale(1.5); filter: blur(20px); pointer-events: none; }

        /* --- STAGE 1: CỬA GỖ --- */
        .gate-container {
            position: relative; width: 300px; height: 420px;
            perspective: 1000px; cursor: pointer;
        }

        .door {
            position: absolute; top: 0; width: 50%; height: 100%;
            background: linear-gradient(to bottom, #800000, #500000);
            border: 4px solid var(--gold);
            box-shadow: inset 0 0 20px #000;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2; display: flex; align-items: center; justify-content: center;
        }
        
        .door-left { left: 0; border-right: 1px solid var(--gold); transform-origin: left; border-radius: 10px 0 0 10px; }
        .door-right { right: 0; border-left: 1px solid var(--gold); transform-origin: right; border-radius: 0 10px 10px 0; }

        .door-knob {
            width: 40px; height: 40px; border-radius: 50%;
            background: radial-gradient(circle, var(--gold), #b8860b);
            border: 2px solid #fff; margin: 10px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        .gate-container.open .door-left { transform: rotateY(-110deg); }
        .gate-container.open .door-right { transform: rotateY(110deg); }

        .knocking { animation: shakeDoor 0.5s infinite; }
        @keyframes shakeDoor {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px) rotateY(1deg); }
            75% { transform: translateX(2px) rotateY(-1deg); }
            100% { transform: translateX(0); }
        }

        .god-hidden {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            opacity: 0; transition: all 1s ease 0.5s; z-index: 1; text-align: center; width: 100%;
        }
        
        .gate-container.open .god-hidden {
            opacity: 1; transform: translate(-50%, -50%) scale(1); z-index: 5;
        }

        .god-title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 2px 2px 0 #000;
            margin-bottom: 20px;
            animation: floatText 3s ease-in-out infinite;
        }

        .btn-gold {
            padding: 12px 30px;
            background: linear-gradient(to bottom, var(--gold), #daa520);
            border: none; border-radius: 50px; color: #800000; font-weight: bold; font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); cursor: pointer;
            animation: pulseBtn 1.5s infinite;
        }

        /* --- STAGE 2: LÌ XÌ KHỔNG LỒ --- */
        .giant-envelope {
            width: 260px; height: 400px;
            background: linear-gradient(135deg, #e60000, #900000);
            border: 4px solid var(--gold); border-radius: 15px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden;
            animation: wiggleBag 2s ease-in-out infinite;
            transform-origin: top center;
        }
        
        .giant-envelope:hover { animation-duration: 0.5s; }

        @keyframes wiggleBag {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(3deg); }
            20% { transform: rotate(-3deg); }
            30% { transform: rotate(2deg); }
            40% { transform: rotate(-2deg); }
        }

        .seal-circle {
            width: 80px; height: 80px; border: 2px solid var(--gold); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; color: var(--gold); background: #800000;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); margin-bottom: 20px;
        }

        /* --- STAGE 3: SINGLE CARD --- */
        .grid-wrapper { 
            width: 100%; max-width: 500px; padding: 20px; 
            text-align: center; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            min-height: 80vh;
        }
        
        .card-container { 
            width: 100%; max-width: 350px; 
            aspect-ratio: 2/3;
            margin: 30px 0;
            position: relative;
        }

        .red-packet { 
            perspective: 1000px; 
            width: 100%; height: 100%;
            cursor: pointer;
        }
        
        .packet-inner { 
            position: relative; width: 100%; height: 100%; 
            text-align: center; 
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d; 
        }
        
        .red-packet.flipped .packet-inner { transform: rotateY(180deg); }

        .packet-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .packet-front { 
            background: linear-gradient(135deg, #e60000, #900000); 
            border: 4px solid var(--gold);
        }
        
        .packet-back { 
            background: linear-gradient(135deg, #fffdf0, #fff8dc); 
            transform: rotateY(180deg); 
            border: 5px solid var(--gold); 
            color: #800000; 
            padding: 20px;
        }

        /* --- STAGE 4: FINAL (NEW) --- */
        .final-message {
            text-align: center;
            animation: zoomIn 1s ease-out;
        }
        .final-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--gold);
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .final-sub {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 40px;
            font-style: italic;
        }
        @keyframes zoomIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Counter & Progress */
        .counter-display { color: var(--gold); font-size: 1.2rem; margin-bottom: 15px; font-family: 'Pacifico'; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
        .progress-bar { width: 80%; max-width: 300px; height: 8px; background: rgba(255, 215, 0, 0.2); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }

        .skip-btn { margin-top: 20px; padding: 10px 25px; border-radius: 50px; border: 2px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; transition: all 0.3s ease; }
        .skip-btn:hover { background: var(--gold); color: #800000; }

        /* Utils */
        @keyframes heartBeat { 0%, 100% { transform: scale(1); } 10% { transform: scale(1.15); } 20% { transform: scale(1); } 30% { transform: scale(1.2); } 40% { transform: scale(1); } }
        @keyframes floatText { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        @keyframes pulseBtn { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
        #effectCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .hint-text { position: absolute; bottom: -50px; width: 100%; text-align: center; color: var(--gold); font-family: 'Pacifico'; animation: blink 2s infinite; }
        @keyframes blink { 0%,100%{opacity:0.6} 50%{opacity:1} }

    </style>
</head>
<body>

    <canvas id="effectCanvas"></canvas>

    <div class="stage active" id="stage1">
        <div style="margin-bottom: 30px; color: var(--gold); font-family: 'Dancing Script'; font-size: 2.5rem; text-shadow: 0 0 10px red;">Xuân Bính Ngọ 2026</div>
        <div class="gate-container knocking" id="mainGate" onclick="openGate()">
            <div class="door door-left"><div class="door-knob"></div></div>
            <div class="door door-right"><div class="door-knob"></div></div>
            <div class="god-hidden">
                <div class="god-title">Thần Tài<br>Gõ Cửa</div>
                <button class="btn-gold" onclick="event.stopPropagation(); goToStage2()">Mở Cửa Đón Lộc</button>
            </div>
            <div class="hint-text">Chạm vào cửa để mở!</div>
        </div>
    </div>

    <div class="stage" id="stage2">
        <div class="giant-envelope" onclick="explodeBag()">
            <div class="seal-circle">Lộc</div>
            <div style="font-family: 'Dancing Script'; font-size: 2.5rem; color: var(--gold); text-shadow: 1px 1px 0 #000;">Khai Xuân<br>Như Ý</div>
            <div style="color: #fff; font-size: 0.9rem; margin-top: 20px; font-style: italic;">(Chạm mạnh để nổ!)</div>
        </div>
    </div>

    <div class="stage" id="stage3">
        <div class="grid-wrapper">
            <h2 style="color: var(--gold); font-family: 'Dancing Script'; font-size: 2.5rem; margin-bottom: 10px;">Lộc Của Bạn Là...</h2>
            <div class="counter-display" id="counterDisplay">Phong bì 1/6</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="card-container" id="cardContainer"></div>
            <button class="skip-btn" onclick="skipToNext()" id="skipBtn">Xem ngay →</button>
        </div>
    </div>

    <div class="stage" id="stage4">
        <div class="final-message">
            <div class="final-title">Cung Chúc<br>Tân Xuân 2026</div>
            <div class="final-sub">Vạn Sự Như Ý - Tỷ Sự Như Mơ<br>Thành Công Mỹ Mãn</div>
            
            <button class="btn-gold" onclick="location.reload()">🧧 Love Love hihi 🧧</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const wishes = [
            { t: "Đại Phú", d: "Tiền vào cửa trước, vàng vào cửa sau.", i: "💎" },
            { t: "Tình Duyên", d: "Hoa đào nở rộ, tình duyên phơi phới.", i: "❤️" },
            { t: "Sức Khỏe", d: "Mạnh như hổ, dẻo dai như ngựa chiến.", i: "💪" },
            { t: "Thăng Tiến", d: "Sếp quý, đồng nghiệp thương, lương tăng vọt.", i: "🚀" },
            { t: "Bình An", d: "Gia đạo êm ấm, vạn sự lành.", i: "🕊️" },
            { t: "May Mắn", d: "Mua đâu thắng đó, quý nhân phù trợ.", i: "🍀" }
        ];

        let currentCardIndex = 0;
        let autoFlipTimer = null;
        let shuffledWishes = [];

        // --- LOGIC ---
        function openGate() {
            const gate = document.getElementById('mainGate');
            gate.classList.remove('knocking');
            gate.classList.add('open');
            document.querySelector('.hint-text').style.display = 'none';
            fireConfetti(window.innerWidth/2, window.innerHeight/2, 20);
        }

        function goToStage2() {
            const s1 = document.getElementById('stage1');
            const s2 = document.getElementById('stage2');
            s1.classList.add('exit');
            setTimeout(() => {
                s1.classList.remove('active');
                s2.classList.add('active');
                s2.querySelector('.giant-envelope').animate([
                    { transform: 'translateY(-100vh) scale(0.5)' },
                    { transform: 'translateY(0) scale(1)' }
                ], { duration: 600, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)' });
            }, 500);
        }

        function explodeBag() {
            const s2 = document.getElementById('stage2');
            const s3 = document.getElementById('stage3');
            const env = s2.querySelector('.giant-envelope');
            env.style.animation = "shakeHard 0.5s infinite";
            
            const styleSheet = document.createElement("style");
            styleSheet.innerText = `@keyframes shakeHard { 0% { transform: translate(1px, 1px) rotate(0deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }`;
            document.head.appendChild(styleSheet);

            setTimeout(() => {
                fireConfetti(window.innerWidth/2, window.innerHeight/2, 200);
                s2.classList.add('exit');
                s2.classList.remove('active');
                s3.classList.add('active');
                startCardSequence();
            }, 600);
        }

        const cardTransitions = [
            (el) => { el.style.opacity='0'; el.style.transform='scale(0) rotate(0deg)'; setTimeout(()=>{el.style.transition='all 0.8s cubic-bezier(0.68,-0.55,0.265,1.55)';el.style.opacity='1';el.style.transform='scale(1) rotate(360deg)';},50); },
            (el) => { el.style.opacity='0'; el.style.transform='translateX(-200%) rotate(-90deg)'; setTimeout(()=>{el.style.transition='all 1s cubic-bezier(0.68,-0.55,0.265,1.55)';el.style.opacity='1';el.style.transform='translateX(0) rotate(0deg)';},50); },
            (el) => { el.style.opacity='0'; el.style.transform='translateY(-150vh) scale(0.5)'; setTimeout(()=>{el.style.transition='all 1s cubic-bezier(0.34,1.56,0.64,1)';el.style.opacity='1';el.style.transform='translateY(0) scale(1)';},50); },
            (el) => { el.style.opacity='0'; el.style.transform='rotate(720deg) scale(0)'; setTimeout(()=>{el.style.transition='all 1s ease-out';el.style.opacity='1';el.style.transform='rotate(0deg) scale(1)';},50); },
            (el) => { el.style.opacity='0'; el.style.transform='translateY(200vh) scale(0.3)'; setTimeout(()=>{el.style.transition='all 1s cubic-bezier(0.175,0.885,0.32,1.275)';el.style.opacity='1';el.style.transform='translateY(0) scale(1)';},50); },
            (el) => { el.style.opacity='0'; el.style.transform='translateX(200%) rotateY(180deg)'; setTimeout(()=>{el.style.transition='all 1s cubic-bezier(0.68,-0.55,0.265,1.55)';el.style.opacity='1';el.style.transform='translateX(0) rotateY(0deg)';},50); }
        ];

        function startCardSequence() {
            shuffledWishes = [...wishes].sort(() => Math.random() - 0.5);
            currentCardIndex = 0;
            showNextCard();
        }

        function showNextCard() {
            // --- HẾT 6 CÁI THÌ QUA STAGE 4 ---
            if (currentCardIndex >= shuffledWishes.length) {
                goToFinale();
                return;
            }

            const container = document.getElementById('cardContainer');
            const wish = shuffledWishes[currentCardIndex];
            
            document.getElementById('counterDisplay').textContent = `Phong bì ${currentCardIndex + 1}/6`;
            document.getElementById('progressFill').style.width = ((currentCardIndex + 1) / 6 * 100) + '%';

            const el = document.createElement('div');
            el.className = 'red-packet';
            el.innerHTML = `
                <div class="packet-inner">
                    <div class="packet-face packet-front"><div style="font-size: 5rem; animation: heartBeat 1.5s ease-in-out infinite;">💖</div></div>
                    <div class="packet-face packet-back">
                        <div style="font-size: 3rem; margin-bottom: 15px;">${wish.i}</div>
                        <div style="font-weight: bold; font-size: 1.8rem; margin: 10px 0; color: var(--red-bright);">${wish.t}</div>
                        <div style="font-size: 1.1rem; line-height: 1.6; color: #666;">${wish.d}</div>
                    </div>
                </div>`;

            container.innerHTML = '';
            container.appendChild(el);
            
            // Random transition nếu index > transitions length (phòng hờ)
            const animFunc = cardTransitions[currentCardIndex % cardTransitions.length];
            animFunc(el);

            setTimeout(() => fireConfetti(window.innerWidth/2, window.innerHeight/2, 40), 500);

            el.onclick = function() {
                if (!this.classList.contains('flipped')) {
                    clearTimeout(autoFlipTimer);
                    flipCurrentCard();
                }
            };

            autoFlipTimer = setTimeout(() => flipCurrentCard(), 5000);
        }

        function flipCurrentCard() {
            const card = document.querySelector('.red-packet');
            if (!card || card.classList.contains('flipped')) return;

            card.classList.add('flipped');
            fireConfetti(window.innerWidth/2, window.innerHeight/2, 60);

            setTimeout(() => {
                const cardEl = document.querySelector('.red-packet');
                if (cardEl) {
                    cardEl.style.transition = 'all 0.6s ease-out';
                    cardEl.style.opacity = '0';
                    cardEl.style.transform = 'scale(0.5) rotate(180deg)';
                }
                setTimeout(() => {
                    currentCardIndex++;
                    showNextCard();
                }, 600);
            }, 3000); // Đọc lời chúc 3s
        }

        function skipToNext() {
            clearTimeout(autoFlipTimer);
            const card = document.querySelector('.red-packet');
            if (card && !card.classList.contains('flipped')) flipCurrentCard();
        }

        // --- STAGE 4: GRAND FINALE ---
        function goToFinale() {
            const s3 = document.getElementById('stage3');
            const s4 = document.getElementById('stage4');
            
            s3.classList.add('exit');
            setTimeout(() => {
                s3.classList.remove('active');
                s4.classList.add('active');
                // Bắn pháo hoa liên tục
                launchFinaleFireworks();
            }, 500);
        }

        function launchFinaleFireworks() {
            let count = 0;
            const interval = setInterval(() => {
                fireConfetti(Math.random()*window.innerWidth, Math.random()*window.innerHeight, 50);
                count++;
                if(count > 10) clearInterval(interval); // Bắn 10 đợt
            }, 500);
        }

        // --- BACKGROUND EFFECT ---
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const particles = Array.from({length: 50}, () => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*3, speed: Math.random()*1+0.5, color: Math.random()>0.5?'#ffd700':'rgba(255,255,255,0.3)'}));
        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.y+=p.speed; if(p.y>canvas.height)p.y=-5; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // --- CONFETTI ---
        function fireConfetti(x, y, n) {
            for(let i=0; i<n; i++) {
                const c = document.createElement('div');
                c.style.cssText = `position:fixed; left:${x}px; top:${y}px; width:8px; height:8px; background:${Math.random()>0.5?'gold':'red'}; pointer-events:none; z-index:9999; border-radius: 50%;`;
                document.body.appendChild(c);
                const angle = Math.random() * Math.PI * 2, v = Math.random() * 150 + 100;
                c.animate([{transform: 'translate(0,0) scale(1)', opacity: 1}, {transform: `translate(${Math.cos(angle)*v}px, ${Math.sin(angle)*v}px) scale(0)`, opacity: 0}], {duration: 1000, easing: 'cubic-bezier(0, 0.5, 0.5, 1)'}).onfinish = () => c.remove();
            }
        }
    </script>
</body>
</html>
