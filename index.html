<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khai Lộc Đầu Xuân 2025</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & BASIC SETUP --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #050000; 
            color: #ffd700; 
            font-family: 'Playfair Display', serif; 
            overflow: hidden; 
            height: 100vh;
            user-select: none; /* Chống bôi đen text */
        }

        /* --- BACKGROUND PARTICLES (Lớp thấp nhất) --- */
        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; /* Nằm dưới cùng */
            pointer-events: none; /* Không chặn click */
        }

        /* --- SNAKE CURSOR (Trang trí chuột) --- */
        .cursor-dot {
            position: fixed; width: 20px; height: 20px;
            background: radial-gradient(circle, #ffd700, transparent);
            border-radius: 50%; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%); transition: transform 0.1s;
        }
        .cursor-trail {
            position: fixed; width: 10px; height: 10px;
            background: rgba(255, 215, 0, 0.5); border-radius: 50%;
            pointer-events: none; z-index: 9998;
        }

        /* --- UI LAYERS --- */
        .stage {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            opacity: 0; pointer-events: none; transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 10; /* Nằm trên canvas */
        }
        .stage.active { opacity: 1; pointer-events: auto; transform: scale(1); }
        .stage.hidden { opacity: 0; transform: scale(1.1); pointer-events: none; }

        /* --- STAGE 1: INTRO --- */
        .intro-box {
            text-align: center; z-index: 20;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px; border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.1);
        }
        .title-main {
            font-family: 'Great Vibes', cursive; font-size: 5rem;
            background: linear-gradient(to bottom, #ffd700, #b8860b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
        }
        .sub-title { font-size: 1.2rem; letter-spacing: 3px; color: #ccc; margin-bottom: 30px; }
        
        .btn-start {
            padding: 15px 50px; font-size: 1.5rem; color: #000;
            background: linear-gradient(45deg, #ffd700, #ffec8b);
            border: none; border-radius: 50px; cursor: pointer;
            font-family: 'Cinzel', serif; font-weight: bold;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transition: all 0.3s; animation: pulseBtn 2s infinite;
        }
        .btn-start:hover { transform: scale(1.1); box-shadow: 0 0 50px rgba(255, 215, 0, 0.8); }

        /* --- STAGE 2: THE 3D ENVELOPE --- */
        .envelope-wrapper { perspective: 1500px; cursor: pointer; }
        .envelope {
            width: 320px; height: 500px;
            background: linear-gradient(135deg, #800000, #400000);
            border: 3px solid #ffd700; border-radius: 15px;
            position: relative; transform-style: preserve-3d;
            transition: transform 0.5s ease;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
        }
        .envelope:hover { transform: translateY(-20px) rotateX(10deg); }
        
        .seal {
            width: 100px; height: 100px; background: radial-gradient(circle, #ffd700, #b8860b);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 3rem; color: #800000; font-family: 'Cinzel', serif; font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
            transform: translateZ(20px); /* Nổi lên trên mặt phong bì */
        }
        .click-hint {
            margin-top: 30px; color: #aaa; font-size: 0.9rem; letter-spacing: 2px;
            animation: fadeHint 1.5s infinite; text-align: center;
        }

        /* --- STAGE 3: FLIP CARDS GRID (Cốt lõi) --- */
        .cards-container {
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;
            width: 90%; max-width: 900px;
            perspective: 1000px;
            z-index: 100; /* Đảm bảo nổi trên cùng */
        }

        .flip-card {
            background-color: transparent;
            width: 100%; aspect-ratio: 3/4; /* Tỉ lệ chuẩn thẻ bài */
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.8s; transform-style: preserve-3d;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }

        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: 15px;
            border: 2px solid #ffd700;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* Mặt trước (Úp) */
        .flip-card-front {
            background: linear-gradient(135deg, #1a0505, #2b0a0a);
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1h2v2H1V1zm4 4h2v2H5V5zm4 4h2v2H9V9zm4 4h2v2h-2v-2zm4 4h2v2h-2v-2z' fill='%23ffd700' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .front-icon { font-size: 3rem; opacity: 0.3; filter: grayscale(1); transition: 0.3s; }
        .flip-card:hover .front-icon { opacity: 1; filter: grayscale(0); transform: scale(1.1); }

        /* Mặt sau (Ngửa) */
        .flip-card-back {
            background: linear-gradient(135deg, #ffd700, #ffec8b);
            color: #800000; transform: rotateY(180deg);
            padding: 15px;
        }
        .wish-icon { font-size: 3rem; margin-bottom: 10px; }
        .wish-title { font-family: 'Cinzel', serif; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px; }
        .wish-text { font-size: 0.9rem; line-height: 1.4; font-weight: 500; }

        /* Nút Reset ở cuối */
        .reset-btn {
            margin-top: 30px; padding: 10px 30px; 
            background: transparent; border: 1px solid #ffd700; color: #ffd700;
            border-radius: 30px; cursor: pointer; opacity: 0; pointer-events: none; transition: 0.5s;
        }
        .reset-btn.show { opacity: 1; pointer-events: auto; }

        /* --- ANIMATIONS --- */
        @keyframes pulseBtn { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        @keyframes fadeHint { 0%,100%{opacity:0.3} 50%{opacity:1} }

        /* Responsive */
        @media (max-width: 768px) {
            .cards-container { grid-template-columns: repeat(2, 1fr); gap: 10px; width: 95%; }
            .title-main { font-size: 3.5rem; }
            .wish-text { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursorDot"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="stage active" id="stage1">
        <div class="intro-box">
            <h1 class="title-main">2025</h1>
            <p class="sub-title">XUÂN ẤT TỴ - PHÚC LỘC TRÀN ĐẦY</p>
            <p style="margin-bottom: 20px;">Gửi đến: <span id="receiver" style="color:#fff; font-weight:bold">Người Bạn Quý</span></p>
            <button class="btn-start" onclick="goToStage2()">KHAI ẤN</button>
        </div>
    </div>

    <div class="stage" id="stage2">
        <div class="envelope-wrapper" onclick="goToStage3()">
            <div class="envelope">
                <div class="seal">福</div>
            </div>
        </div>
        <p class="click-hint">Chạm vào Phong Bao để mở vận may</p>
    </div>

    <div class="stage" id="stage3">
        <h2 style="margin-bottom: 20px; font-family: 'Cinzel'; text-shadow: 0 0 10px #ffd700;">CHỌN 6 QUẺ LỘC ĐẦU NĂM</h2>
        <div class="cards-container" id="cardsGrid">
            </div>
        <button class="reset-btn" id="resetBtn" onclick="location.reload()">Làm lại từ đầu</button>
    </div>

    <script>
        // --- 1. PERSONALIZATION (URL PARAMS) ---
        const urlParams = new URLSearchParams(window.location.search);
        const toName = urlParams.get('to');
        if(toName) document.getElementById('receiver').innerText = toName;

        // --- 2. DATA: 6 LỜI CHÚC (Thẻ Bài) ---
        const wishes = [
            { icon: "💰", title: "Tài Lộc", text: "Tiền vào như nước, ví dày quanh năm. Đầu tư đâu thắng đó." },
            { icon: "❤️", title: "Tình Duyên", text: "Hạnh phúc viên mãn. Người độc thân sớm gặp ý trung nhân." },
            { icon: "🏆", title: "Sự Nghiệp", text: "Thăng quan tiến chức. Công việc thuận buồm xuôi gió." },
            { icon: "💪", title: "Sức Khỏe", text: "Dẻo dai như Rắn, mạnh mẽ kiên cường. Bệnh tật tiêu tan." },
            { icon: "✈️", title: "Du Lịch", text: "Năm nay sẽ có những chuyến đi xa tuyệt vời đầy ắp kỷ niệm." },
            { icon: "🌟", title: "May Mắn", text: "Vạn sự như ý. Gặp dữ hóa lành, quý nhân phù trợ." }
        ];

        // --- 3. AUDIO ENGINE (Âm thanh tự tạo) ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'flip') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'bg') {
                // Intro sound
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(600, now + 1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 1.5);
                osc.start(now);
                osc.stop(now + 1.5);
            }
        }

        // --- 4. STAGE MANAGEMENT ---
        function goToStage2() {
            playSound('bg');
            document.getElementById('stage1').classList.remove('active');
            document.getElementById('stage1').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('stage2').classList.add('active');
            }, 500);
        }

        function goToStage3() {
            playSound('click');
            // Effect nổ
            createExplosion(window.innerWidth/2, window.innerHeight/2);
            
            document.getElementById('stage2').classList.remove('active');
            document.getElementById('stage2').classList.add('hidden');
            
            renderCards(); // Tạo thẻ bài
            
            setTimeout(() => {
                document.getElementById('stage3').classList.add('active');
            }, 500);
        }

        // --- 5. RENDER CARDS & INTERACTION ---
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            
            wishes.forEach((wish, index) => {
                const card = document.createElement('div');
                card.className = 'flip-card';
                card.style.opacity = '0';
                card.style.animation = `pulseBtn 0.5s forwards ${index * 0.1}s`; // Fade in từng cái
                
                card.innerHTML = `
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <div class="front-icon">🐍</div>
                        </div>
                        <div class="flip-card-back">
                            <div class="wish-icon">${wish.icon}</div>
                            <div class="wish-title">${wish.title}</div>
                            <div class="wish-text">${wish.text}</div>
                        </div>
                    </div>
                `;

                // Click event cho từng thẻ
                card.onclick = function() {
                    if (!this.classList.contains('flipped')) {
                        this.classList.add('flipped');
                        playSound('flip');
                        createExplosion(this.getBoundingClientRect().left + this.offsetWidth/2, this.getBoundingClientRect().top + this.offsetHeight/2);
                        checkAllFlipped();
                    }
                };

                grid.appendChild(card);
                
                // Hack animation fill mode
                setTimeout(() => card.style.opacity = '1', index * 100 + 500);
            });
        }

        function checkAllFlipped() {
            const flipped = document.querySelectorAll('.flipped').length;
            if (flipped === wishes.length) {
                document.getElementById('resetBtn').classList.add('show');
            }
        }

        // --- 6. SNAKE CURSOR ---
        const cursor = document.getElementById('cursorDot');
        const trails = [];
        const numTrails = 8;
        
        for(let i=0; i<numTrails; i++) {
            const t = document.createElement('div');
            t.className = 'cursor-trail';
            document.body.appendChild(t);
            trails.push({ el: t, x: 0, y: 0 });
        }

        let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
        
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        function animateCursor() {
            let x = mouseX; let y = mouseY;
            trails.forEach((t, i) => {
                t.x += (x - t.x) * 0.3;
                t.y += (y - t.y) * 0.3;
                t.el.style.left = t.x - 5 + 'px';
                t.el.style.top = t.y - 5 + 'px';
                t.el.style.opacity = (1 - i/numTrails);
                t.el.style.transform = `scale(${1 - i/numTrails})`;
                x = t.x; y = t.y;
            });
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // --- 7. PARTICLE BACKGROUND ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];

        function createExplosion(x, y) {
            for(let i=0; i<30; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15,
                    life: 1, color: '#ffd700'
                });
            }
        }

        // Tạo hạt bay nền (Gold dust)
        for(let i=0; i<50; i++) {
            particles.push({
                x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5,
                life: Math.random(), color: '#ffffff', isBg: true
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                
                if (p.isBg) {
                    if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                    ctx.globalAlpha = p.life * 0.5;
                    ctx.fillStyle = '#fff';
                } else {
                    p.life -= 0.03;
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    if(p.life <= 0) particles.splice(i, 1);
                }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.isBg ? Math.random()*2 : 3, 0, Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        });

    </script>
</body>
</html>
