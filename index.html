<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lộc Thần Tài 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@700;900&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* --- 1. SETUP & THEME TẾT --- */
        :root {
            --red-bg: #800000;
            --red-bright: #e60000;
            --gold: #ffd700;
            --gold-shine: #fff8d6;
            --paper: #fffdf0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--red-bg);
            /* Họa tiết gấm sang trọng */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(100,0,0,0) 0%, rgba(40,0,0,0.8) 100%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 30c-5 0-10-5-10-10s5-10 10-10 10 5 10 10-5 10-10 10zm0 0c5 0 10 5 10 10s-5 10-10 10-10-5-10-10 5-10 10-10z' fill='%23ffd700' fill-opacity='0.05'/%3E%3C/svg%3E");
            overflow: hidden;
            height: 100vh;
            font-family: 'Playfair Display', serif;
            display: flex; justify-content: center; align-items: center;
        }

        /* Canvas Hoa Rơi */
        #flowerCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        /* Container Chính */
        .stage {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); /* Hiệu ứng nảy */
            z-index: 10;
        }
        
        .stage.active { opacity: 1; pointer-events: auto; transform: scale(1); }
        .stage.exit { opacity: 0; transform: scale(1.5); filter: blur(10px); pointer-events: none; }

        /* --- STAGE 1: THẦN TÀI & CỤC VÀNG --- */
        .god-container { text-align: center; position: relative; }
        
        .god-image {
            width: 200px; height: auto;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
            animation: float 3s ease-in-out infinite;
        }

        /* Hào quang xoay sau lưng Thần Tài */
        .god-aura {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            background: conic-gradient(from 0deg, transparent, rgba(255, 215, 0, 0.3), transparent);
            border-radius: 50%; z-index: -1;
            animation: spin 10s linear infinite;
        }

        .gold-ingot {
            font-size: 5rem; cursor: pointer;
            margin-top: -20px; z-index: 10; position: relative;
            filter: drop-shadow(0 0 15px var(--gold));
            transition: transform 0.1s;
            animation: shake 0.5s infinite; /* Rung lắc liên tục */
        }
        
        .gold-ingot:active { transform: scale(0.9); }
        
        .click-hint {
            color: var(--gold); font-family: 'Pacifico', cursive; margin-top: 20px;
            font-size: 1.2rem; animation: pulse 1s infinite;
        }

        /* --- STAGE 2: LÌ XÌ KHỔNG LỒ --- */
        .giant-envelope {
            width: 280px; height: 450px;
            background: linear-gradient(135deg, #d60000, #900000);
            border: 4px solid var(--gold); border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative;
            transform-style: preserve-3d;
        }
        
        .giant-envelope:hover { transform: scale(1.05); }

        .giant-seal {
            width: 90px; height: 90px; background: radial-gradient(circle, var(--gold), #daa520);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; color: #900000; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 2px solid #fff;
        }

        .giant-text {
            font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: var(--gold);
            margin-top: 20px; text-shadow: 2px 2px 0 #000;
        }
        
        .glow-effect {
            position: absolute; width: 100%; height: 100%; border-radius: 20px;
            box-shadow: 0 0 30px var(--gold);
            animation: glowPulse 2s infinite; pointer-events: none;
        }

        /* --- STAGE 3: GRID 6 BAO LÌ XÌ NHỎ --- */
        .grid-wrapper {
            width: 100%; max-width: 800px; padding: 20px;
            text-align: center; overflow-y: auto; max-height: 100vh;
        }

        .header-2026 {
            font-family: 'Dancing Script', cursive; font-size: 3rem; color: var(--gold);
            margin-bottom: 20px; text-shadow: 0 0 10px #ff0000;
        }

        .card-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            padding-bottom: 40px;
        }
        @media(min-width: 768px) { .card-grid { grid-template-columns: repeat(3, 1fr); gap: 25px; } }

        .red-packet {
            aspect-ratio: 2/3; position: relative; perspective: 1000px; cursor: pointer;
        }

        .packet-inner {
            width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d; position: relative;
        }

        .red-packet.open .packet-inner { transform: rotateY(180deg); }

        .packet-front, .packet-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .packet-front {
            background: linear-gradient(135deg, #ff0000, #b30000);
            border: 2px solid var(--gold);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .packet-decor {
            font-size: 2rem; color: rgba(255,215,0,0.8); font-weight: bold; border: 2px solid rgba(255,215,0,0.5);
            width: 50px; height: 50px; display: flex; justify-content: center; align-items: center;
            border-radius: 50%; transform: rotate(45deg);
        }
        .packet-decor span { transform: rotate(-45deg); }

        .packet-back {
            background: var(--paper); color: #800000; transform: rotateY(180deg);
            padding: 10px; border: 2px solid var(--gold);
        }

        .wish-text { font-family: 'Playfair Display', serif; font-size: 0.9rem; font-weight: bold; line-height: 1.4; }
        .wish-icon { font-size: 2rem; margin-bottom: 5px; }

        /* --- ANIMATIONS --- */
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        @keyframes spin { 100% { transform: translate(-50%,-50%) rotate(360deg); } }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 50% { transform: rotate(0deg); } 75% { transform: rotate(-10deg); } 100% { transform: rotate(0deg); } }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        @keyframes glowPulse { 0%,100%{box-shadow:0 0 20px var(--gold)} 50%{box-shadow:0 0 50px var(--gold)} }

    </style>
</head>
<body>

    <canvas id="flowerCanvas"></canvas>

    <div class="stage active" id="stage1">
        <div class="god-container">
            <div class="god-aura"></div>
            <div class="god-image" style="font-size: 8rem;">🎅</div> 
            <div style="font-family:'Dancing Script'; color:var(--gold); font-size:2rem; margin-top:-20px;">Thần Tài Gõ Cửa</div>
            
            <div class="gold-ingot" onclick="openGiantBag()">💰</div>
            <div class="click-hint">Chạm vào Vàng để nhận lộc!</div>
        </div>
    </div>

    <div class="stage" id="stage2">
        <div class="giant-envelope" onclick="explodeBag()">
            <div class="glow-effect"></div>
            <div class="giant-seal">2026</div>
            <div class="giant-text">Lộc Lớn</div>
            <div class="click-hint" style="position:absolute; bottom:20px;">Chạm để nổ lì xì!</div>
        </div>
    </div>

    <div class="stage" id="stage3">
        <div class="grid-wrapper">
            <div class="header-2026">Xuân Bính Ngọ 2026</div>
            <div style="color:#fff; margin-bottom:20px;">Chúc <span id="name-display" style="color:var(--gold); font-weight:bold;">Bạn</span> vạn sự như ý</div>
            
            <div class="card-grid" id="gridContainer">
                </div>

            <button onclick="location.reload()" style="padding:10px 30px; border-radius:50px; border:1px solid var(--gold); background:transparent; color:var(--gold); cursor:pointer;">
                Làm lại từ đầu
            </button>
        </div>
    </div>

    <script>
        // --- 1. CONFIG & DATA ---
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('to') || "Bạn Hiền";
        document.getElementById('name-display').innerText = userName;

        const wishes = [
            { icon: "🐴", title: "Mã Đáo", text: "Năm Ngựa phi nước đại, công danh sự nghiệp tiến xa ngàn dặm." },
            { icon: "💰", title: "Tài Lộc", text: "Tiền vào cửa trước, vàng vào cửa sau. Hai cái gặp nhau, chui vào két sắt." },
            { icon: "❤️", title: "Tình Duyên", text: "Đào hoa nở rộ, sớm gặp người thương, hạnh phúc đong đầy." },
            { icon: "🛡️", title: "Sức Khỏe", text: "Mạnh như Hổ, dẻo dai như Rắn, bền bỉ như Ngựa chiến." },
            { icon: "✈️", title: "Du Hí", text: "Năm nay xách ba lô lên và đi. Những chuyến đi xa mang về vận may lớn." },
            { icon: "🌟", title: "May Mắn", text: "Quý nhân phù trợ, gặp dữ hóa lành, vạn sự hanh thông." }
        ];

        // --- 2. LOGIC CHUYỂN CẢNH ---
        
        // Từ Thần Tài -> Bao to
        function openGiantBag() {
            // Hiệu ứng nổ nhỏ
            createConfetti(window.innerWidth/2, window.innerHeight/2, 20);
            
            const s1 = document.getElementById('stage1');
            const s2 = document.getElementById('stage2');

            s1.classList.add('exit');
            setTimeout(() => {
                s1.classList.remove('active');
                s2.classList.add('active');
                // Hiệu ứng bao to rơi xuống
                s2.style.animation = "bounceIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)";
            }, 500);
        }

        // Từ Bao to -> Nổ ra bao nhỏ
        function explodeBag() {
            // Hiệu ứng nổ lớn
            createConfetti(window.innerWidth/2, window.innerHeight/2, 100);
            
            const s2 = document.getElementById('stage2');
            const s3 = document.getElementById('stage3');

            // Hiệu ứng rung bần bật trước khi nổ
            s2.querySelector('.giant-envelope').style.animation = "shake 0.2s infinite";
            
            setTimeout(() => {
                s2.classList.add('exit');
                s2.classList.remove('active');
                s3.classList.add('active');
                renderGrid(); // Tạo các bao lì xì nhỏ
            }, 500);
        }

        // --- 3. RENDER GRID ---
        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            
            // Xáo trộn lời chúc
            wishes.sort(() => Math.random() - 0.5);

            wishes.forEach((w, i) => {
                const el = document.createElement('div');
                el.className = 'red-packet';
                // Animation bay vào
                el.style.opacity = '0';
                el.style.transform = 'translateY(50px)';
                el.style.transition = 'all 0.5s ease ' + (i * 0.1) + 's';
                
                el.innerHTML = `
                    <div class="packet-inner">
                        <div class="packet-front">
                            <div class="packet-decor"><span>福</span></div>
                            <div style="color:var(--gold); font-size:0.8rem; margin-top:5px;">Mở Lộc</div>
                        </div>
                        <div class="packet-back">
                            <div class="wish-icon">${w.icon}</div>
                            <div class="wish-text" style="color:#b30000;">${w.title}</div>
                            <div class="wish-text" style="font-weight:normal; margin-top:5px; font-size:0.8rem;">${w.text}</div>
                        </div>
                    </div>
                `;

                // Click mở bao
                el.onclick = function() {
                    if(!this.classList.contains('open')) {
                        this.classList.add('open');
                        createConfetti(
                            this.getBoundingClientRect().left + this.offsetWidth/2,
                            this.getBoundingClientRect().top + this.offsetHeight/2,
                            15
                        );
                    }
                };

                container.appendChild(el);
                
                // Kích hoạt animation bay vào
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 50);
            });
        }

        // --- 4. HIỆU ỨNG HOA RƠI (CANVAS) ---
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const petals = [];
        for(let i=0; i<50; i++) petals.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 5 + 2,
            speed: Math.random() * 1 + 0.5,
            color: Math.random() > 0.5 ? '#ffd700' : '#ff9999' // Vàng hoặc Hồng
        });

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.y += p.speed;
                p.x += Math.sin(p.y * 0.01);
                if(p.y > canvas.height) p.y = -10;
                
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // --- 5. HIỆU ỨNG NỔ (CONFETTI SIMPLE) ---
        function createConfetti(x, y, count) {
            // Đây là hàm giả lập nổ đơn giản bằng DOM để không cần thư viện
            // Nếu muốn xịn hơn có thể dùng canvas-confetti library
            for(let i=0; i<count; i++) {
                const c = document.createElement('div');
                c.style.position = 'fixed';
                c.style.left = x + 'px';
                c.style.top = y + 'px';
                c.style.width = '5px';
                c.style.height = '5px';
                c.style.background = Math.random() > 0.5 ? '#ffd700' : '#fff';
                c.style.zIndex = '9999';
                document.body.appendChild(c);

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 100 + 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                c.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000,
                    easing: 'ease-out'
                }).onfinish = () => c.remove();
            }
        }
        
        // CSS Animation Helper
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes bounceIn {
                0% { transform: scale(0); opacity: 0; }
                50% { transform: scale(1.1); }
                100% { transform: scale(1); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
